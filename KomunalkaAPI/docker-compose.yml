version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: KomunalkaAPI/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=komunalka;Username=postgres;Password=postgres
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - komunalka-network

  db:
    image: postgres:17-alpine
    container_name: komunalka-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=komunalka
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=256MB -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - komunalka-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: komunalka-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - komunalka-network

networks:
  komunalka-network:
    driver: bridge

volumes:
  postgres-data:
