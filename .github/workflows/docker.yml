name: Docker Build

on:
  push:
    branches: [ master, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: 'Push to GitHub Container Registry'
        required: false
        default: 'true'
        type: boolean
      tag:
        description: 'Custom tag for the image (optional)'
        required: false
        type: string
  schedule:
    # Запуск щотижня у неділю о 03:00 UTC (05:00 Kyiv time)
    - cron: '0 3 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request' && (inputs.push_to_registry != 'false')
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix={{branch}}-
          type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' && (inputs.push_to_registry != 'false') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Docker Compose test
      run: docker-compose build

    - name: Send Telegram notification
      if: always() && (github.event_name == 'push' || github.event_name == 'schedule')
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        format: markdown
        message: |
          ${{ job.status == 'success' && '🐳' || '❌' }} **Docker Build ${{ job.status == 'success' && 'Completed' || 'Failed' }}**

          Repository: `${{ github.repository }}`
          Branch: `${{ github.ref_name }}`
          Tags: ${{ steps.meta.outputs.tags }}
          Pushed: ${{ github.event_name != 'pull_request' && (inputs.push_to_registry != 'false') }}

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          [View packages](${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})
